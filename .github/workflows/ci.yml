name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'
  REGISTRY: leadtracker.azurecr.io
  API_IMAGE_NAME: leadtracker-api
  WEB_IMAGE_NAME: leadtracker-web

jobs:
  test-api:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadtracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore api/LeadTracker.sln
      
    - name: Build solution
      run: dotnet build api/LeadTracker.sln --no-restore --configuration Release
      
    - name: Run unit tests
      run: |
        dotnet test api/tests/LeadTracker.UnitTests \
          --no-build \
          --configuration Release \
          --logger trx \
          --collect:"XPlat Code Coverage" \
          --results-directory ./test-results
      
    - name: Run integration tests
      run: |
        dotnet test api/tests/LeadTracker.IntegrationTests \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory ./test-results
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=leadtracker_test;Username=postgres;Password=postgres"
        Redis__ConnectionString: "localhost:6379"
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-results
        path: |
          ./test-results/**/*.trx
          ./test-results/**/coverage.cobertura.xml
          
    - name: Publish code coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./test-results/**/coverage.cobertura.xml
        flags: api
        name: API Coverage

  test-web:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci --prefer-offline
      working-directory: web
      
    - name: Run ESLint
      run: npm run lint
      working-directory: web
      
    - name: Run TypeScript type checking
      run: npm run type-check
      working-directory: web
      
    - name: Run unit tests
      run: npm run test:ci
      working-directory: web
      
    - name: Build application
      run: npm run build
      working-directory: web
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: web-test-results
        path: |
          web/coverage/
          web/test-results/
          
    - name: Publish code coverage
      uses: codecov/codecov-action@v4
      with:
        file: web/coverage/lcov.info
        flags: web
        name: Web Coverage

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci --prefer-offline
      working-directory: web
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      working-directory: web
      
    - name: Start services with Docker Compose
      run: |
        docker-compose up -d postgres redis
        sleep 10
        
    - name: Build and start API
      run: |
        dotnet build api/LeadTracker.sln --configuration Release
        dotnet run --project api/LeadTracker.Api --configuration Release &
        sleep 30
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=leadtracker_test;Username=postgres;Password=postgres"
        Redis__ConnectionString: "localhost:6379"
        JWT__SecretKey: "test-secret-key-for-e2e-tests-minimum-32-chars"
        
    - name: Build and start Web
      run: |
        npm run build
        npm start &
        sleep 15
      working-directory: web
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXTAUTH_SECRET: test-secret-for-e2e
        NEXTAUTH_URL: http://localhost:3000
        
    - name: Run E2E tests
      run: npm run test:e2e
      working-directory: web
      
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          web/test-results/
          web/playwright-report/

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Run .NET security scan
      run: |
        dotnet list api/LeadTracker.sln package --vulnerable --include-transitive
        
    - name: Run npm audit
      run: npm audit --audit-level moderate
      working-directory: web
      continue-on-error: true

  build-images:
    runs-on: ubuntu-latest
    needs: [test-api, test-web, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
        
    - name: Extract metadata for API
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Extract metadata for Web
      id: meta-web
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: api
        file: api/Dockerfile
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        
    - name: Build and push Web image
      uses: docker/build-push-action@v5
      with:
        context: web
        file: web/Dockerfile
        push: true
        tags: ${{ steps.meta-web.outputs.tags }}
        labels: ${{ steps.meta-web.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test-api, test-web, e2e-tests, security-scan]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        if [[ "${{ needs.test-api.result }}" == "failure" ]]; then
          echo "API tests failed"
          exit 1
        fi
        if [[ "${{ needs.test-web.result }}" == "failure" ]]; then
          echo "Web tests failed"
          exit 1
        fi
        if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
          echo "E2E tests failed"
          exit 1
        fi
        if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
          echo "Security scan failed"
          exit 1
        fi
        echo "All quality gates passed!"

  notify:
    runs-on: ubuntu-latest
    needs: [build-images, quality-gate]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Notify on success
      if: needs.build-images.result == 'success' && needs.quality-gate.result == 'success'
      run: |
        echo "✅ CI Pipeline completed successfully for ${{ github.ref_name }}"
        # Add Slack/Teams notification here if needed
        
    - name: Notify on failure
      if: needs.build-images.result == 'failure' || needs.quality-gate.result == 'failure'
      run: |
        echo "❌ CI Pipeline failed for ${{ github.ref_name }}"
        # Add Slack/Teams notification here if needed
        exit 1
