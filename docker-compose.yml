services:
  postgres:
    image: postgres:15-alpine
    container_name: leadtracker-db
    environment:
      POSTGRES_DB: leadtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadtracker-network

  redis:
    image: redis:7-alpine
    container_name: leadtracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - leadtracker-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: leadtracker-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=leadtracker;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - JWT__SecretKey=your-super-secret-jwt-key-change-this-in-production
      - JWT__Issuer=https://leadtracker.local
      - JWT__Audience=https://leadtracker.local
      - JWT__ExpiryMinutes=15
      - Email__SmtpHost=mailhog
      - Email__SmtpPort=1025
      - Email__FromAddress=noreply@leadtracker.local
      - Email__FromName=Lead Tracker
      - Hangfire__DashboardPath=/hangfire
      - Hangfire__DashboardTitle=Lead Tracker Jobs
      - Serilog__MinimumLevel=Information
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - leadtracker-network
    volumes:
      - ./api/logs:/app/logs

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: leadtracker-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api:8080
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-super-secret-nextauth-key-change-this-in-production
      - NEXT_PUBLIC_APP_NAME=Lead Tracker
      - NEXT_PUBLIC_APP_VERSION=1.0.0-dev
    depends_on:
      api:
        condition: service_healthy
    networks:
      - leadtracker-network

  nginx:
    image: nginx:alpine
    container_name: leadtracker-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
      - web
    networks:
      - leadtracker-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: leadtracker-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - leadtracker-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leadtracker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@leadtracker.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - leadtracker-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  pgadmin_data:
    driver: local

networks:
  leadtracker-network:
    driver: bridge
    name: leadtracker-network
