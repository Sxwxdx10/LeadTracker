version: '3.8'

services:
  postgres-test:
    image: postgres:15
    container_name: leadtracker-postgres-test
    environment:
      POSTGRES_DB: leadtracker_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d leadtracker_test -h localhost"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - test-network

volumes:
  postgres_test_data:

networks:
  test-network:
    driver: bridge